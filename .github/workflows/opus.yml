name: Opus extension

# Rebuilds the Opus voice codec GDExtension (native/opus_voice) for Linux,
# Windows and macOS whenever its sources change, and uploads the libraries.
# To update the committed ones: download the "opus-voice-bin" artifact into
# addons/opus_voice/bin/ (or run tools/build_opus.sh locally) and commit.
on:
  push:
    paths: ["native/**", "tools/build_opus.sh", ".github/workflows/opus.yml"]
  pull_request:
    paths: ["native/**", "tools/build_opus.sh", ".github/workflows/opus.yml"]
  workflow_dispatch:

jobs:
  build:
    name: Build (Linux, Windows, macOS)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchains (Zig for Linux + macOS, MinGW-w64 for Windows)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q mingw-w64 cmake
          pip install ziglang==0.13.0

      - name: Build
        run: tools/build_opus.sh linux windows macos

      - name: Check the Linux library
        run: |
          so=addons/opus_voice/bin/libopus_voice.linux.x86_64.so
          # Only the entry point is exported, and it runs on glibc 2.28+.
          test "$(nm -D --defined-only "$so" | awk '{print $3}')" = "opus_voice_library_init"
          objdump -T "$so" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1
          readelf -d "$so" | grep -q NODELETE

      - uses: actions/upload-artifact@v4
        with:
          name: opus-voice-bin
          path: addons/opus_voice/bin/
