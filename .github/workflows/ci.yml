name: CI

on:
  push:
    branches: [main, devlop]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.4.1"

jobs:
  test:
    name: Smoke + multiplayer tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Install Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot && cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot && rm godot.zip

      - name: Import project
        run: ~/godot/godot --headless --path . --editor --quit || true

      - name: Smoke test
        run: ~/godot/godot --headless --path . res://tests/smoke_test.tscn

      - name: Multiplayer tests (TDM, Bomb Defusal, anti-cheat)
        run: tools/run_net_test.sh ~/godot/godot

      - name: Upload test logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: net-test-logs
          path: /tmp/net_test_*.log
