; Starting graphics preset per GPU (first launch and Settings → "Auto-detect").
;
; Checked top to bottom: the first section whose name appears in the GPU name
; (lower-case) wins; GPUs not listed fall back to the RAM / GPU-type rules in
; SettingsManager.detect_recommended_quality().
;
; Measured entries come from players' hardware reports:
;   tools/tune_presets.py reports/*.json --apply
; Keep more specific names above broader ones ("uhd graphics 6" before "hd graphics").

[uhd graphics 6]
preset="low"
source="minimum spec (README), not measured yet"

[radeon vega 8]
preset="low"
source="minimum spec (README), not measured yet"

[hd graphics]
preset="low"
source="older Intel iGPUs (below minimum spec), not measured yet"
